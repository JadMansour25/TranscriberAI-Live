<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transcriber.ai — Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Transcriber.ai</h1>
    <p class="sub">Live transcription (Dutch & English) — in your browser.</p>

    <div class="controls">
      <label>
        Language
        <select id="lang">
          <option value="nl-NL">Dutch (nl-NL)</option>
          <option value="en-US">English (en-US)</option>
        </select>
      </label>

      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <button id="download" disabled>Download TXT</button>
      <span id="status" class="badge">idle</span>
    </div>

    <div id="partial" class="partial"></div>
    <div id="finals" class="finals"></div>

    <footer>
      <small>
        Tip: speak clearly; short phrases work best. Works best in Chrome.
      </small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
