<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transcriber.ai — Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Transcriber.ai</h1>
    <p class="sub">Live transcription — multilingual, Dutch, English, Arabic & more.</p>

    <div class="controls">
      <label>
        Language
        <select id="lang"></select>
      </label>

      <label style="display:flex;gap:6px;align-items:center">
        <input type="checkbox" id="pro" />
        Use Pro (Deepgram)
      </label>

      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <button id="download" disabled>Download TXT</button>
      <span id="status" class="badge">idle</span>
    </div>

    <div id="partial" class="partial"></div>
    <div id="finals" class="finals"></div>

    <footer>
      <small>
        Tip: Use Chrome for best results. First connection in Pro mode may take a few seconds.
      </small>
    </footer>
  </div>

  <!-- cache-buster => always fetch latest script -->
  <script src="script.js?v=4"></script>
</body>
</html>
