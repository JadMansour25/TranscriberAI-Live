<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Transcriber.ai — Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <h1>Transcriber.ai</h1>
    <p class="sub">Live transcription — multilingual.</p>

    <div class="controls">
      <label>
        Language
        <!-- leave empty; script.js fills it with many languages -->
        <select id="lang"></select>
      </label>

      <label style="display:flex;gap:6px;align-items:center">
        <input type="checkbox" id="pro" />
        Use Pro (Deepgram)
      </label>

      <button id="start">Start</button>
      <button id="stop" disabled>Stop</button>
      <button id="download" disabled>Download TXT</button>
      <span id="status" class="badge">idle</span>
    </div>

    <div id="partial" class="partial"></div>
    <div id="finals" class="finals"></div>

    <footer>
      <small>Tip: speak clearly; short phrases work best. Works on Chrome, Safari, iPhone. Pro mode uses your secure gateway.</small>
    </footer>
  </div>

  <!-- add ?v=2 to bust cache after this change -->
  <script src="script.js?v=2"></script>
</body>
</html>
